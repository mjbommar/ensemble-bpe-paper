[data]
provider = "hf_books"
dataset = "common-pile/project_gutenberg"
split = "train"
text_field = "text"
out_dir = "data/processed/pg_books_ens_smoke"
train_size = 2000
valid_size = 200
test_size = 200
seed = 17
streaming = true
oos_by_hash = true
oos_frac = 0.1

[train]
exp_name = "pg_bpe_16k_ens_smoke_s17"
algo = "hf_bpe"
vocab_size = 16384

[ensemble]
enabled = true
num_shards = 2
vocab_size = 16384
  [ensemble.merge]
  enabled = true
  k = 2

[eval]
run_oos = true

[baselines]
tiktoken.encodings = ["gpt2"]

[artifacts]
out_dir = "artifacts"

