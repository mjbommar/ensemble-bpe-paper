[data]
provider = "hf_books"
dataset = "common-pile/project_gutenberg"
split = "train"
text_field = "text"
out_dir = "data/processed/pg_books_32k_sample"
train_size = 500000   # documents (lines), adjust upward for full runs
valid_size = 10000
test_size = 10000
seed = 13

[train]
exp_name = "pg_bpe_32k"
algo = "hf_bpe"
vocab_size = 32768

[eval]
run_oos = true

[oos_data]
provider = "hf_books"
dataset = "common-pile/project_gutenberg"
split = "train"
text_field = "text"
out_dir = "data/processed/pg_books_32k_oos"
train_size = 0
valid_size = 0
test_size = 20000
seed = 23

[baselines]
tiktoken.encodings = ["gpt2"]

[artifacts]
out_dir = "artifacts"

