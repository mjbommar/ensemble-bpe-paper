[data]
provider = "hf_books"
dataset = "common-pile/project_gutenberg"
split = "train"
text_field = "text"
out_dir = "data/processed/pg_books_step1"
train_size = 2000
valid_size = 200
test_size = 200
seed = 13
streaming = true
oos_by_hash = true
oos_frac = 0.1

[train]
exp_name = "e1_pg_step1"
vocab_size = 8192

[eval]
run_oos = true

[artifacts]
out_dir = "artifacts"

