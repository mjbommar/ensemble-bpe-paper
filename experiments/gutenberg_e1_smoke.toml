[data]
provider = "hf_books"
dataset = "common-pile/project_gutenberg"
split = "train"
text_field = "text"
out_dir = "data/processed/pg_books_smoke"
train_size = 200
valid_size = 20
test_size = 20
seed = 13
streaming = true
oos_by_hash = true
oos_frac = 0.2

[train]
exp_name = "e1_pg_smoke"
vocab_size = 8192

[eval]
run_oos = true

[artifacts]
out_dir = "artifacts"

