[data]
provider = "hf_books"
dataset = "common-pile/project_gutenberg"
split = "train"
text_field = "text"
out_dir = "data/processed/pg_paper_small"
train_size = 500
valid_size = 50
test_size = 50
seed = 13
streaming = true
oos_by_hash = true
oos_frac = 0.1

[train]
exp_name = "pg_bpe_32k_ens"
algo = "hf_bpe"
vocab_size = 32768

[ensemble]
enabled = true
num_shards = 2
vocab_size = 32768
  [ensemble.merge]
  enabled = true
  k = 2

[eval]
run_oos = true

[artifacts]
out_dir = "artifacts"

